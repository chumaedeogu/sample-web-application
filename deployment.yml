apiVersion: apps/v1
kind: Deployment
metadata:
   name: app
   labels:
      app: "db"
      function: "backend"
spec:
   replicas: 3
   selector:
      matchLabels:
          env: "test"
   template:
       metadata:
          labels:
            env: "test"
       spec:
          containers:
            - name: testing
              image: chumaedeogu/connect:40
              ports:
                - name: port1
                  containerPort: 8080
---
apiVersion: v1
kind: Service
metadata: 
   name: service1
spec:
   type: NodePort
   selector:
      env: "test"
   ports:
      - protocol: TCP
        port: 8080
        targetPort: 8080
        nodePort: 30003
